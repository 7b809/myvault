<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f14">
  <meta name="description" content="Vaultra — private cloud for files, links, and notes">
  <title>Vaultra</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/static/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/icons/icon.svg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="/static/icons/icon.svg" alt="" class="brand-logo">
      <div class="brand-text">
        <h1>Vaultra</h1>
        <span>Private cloud</span>
      </div>
    </div>

    <div class="topbar-actions">
      <nav class="tabs" id="kind-tabs" role="tablist">
        <button class="tab active" data-kind="file" role="tab" aria-selected="true">
          <i class="bi bi-file-earmark-text"></i>
          <span>Files</span>
        </button>
        <button class="tab" data-kind="link" role="tab" aria-selected="false">
          <i class="bi bi-link-45deg"></i>
          <span>Links</span>
        </button>
        <button class="tab" data-kind="note" role="tab" aria-selected="false">
          <i class="bi bi-journal-text"></i>
          <span>Notes</span>
        </button>
      </nav>

      <button class="tab logout-btn" id="logout-btn"
              type="button"
              title="Sign out"
              aria-label="Sign out">
        <i class="bi bi-box-arrow-right"></i>
      </button>
    </div>
  </header>

  <main class="container">
    <div class="toolbar">
      <div class="search-box input-group">
        <span class="input-group-text"><i class="bi bi-search"></i></span>
        <input id="search" type="search" class="form-control" placeholder="Search…" autocomplete="off">
      </div>
      <div class="stats" id="stats"></div>
    </div>
    <section id="grid" class="grid" aria-live="polite"></section>
    <p id="empty" class="empty hidden" aria-live="polite">
      Nothing here yet — tap <strong>+</strong> to add an item, or use the
      <i class="bi bi-layers"></i> view button to switch sections.
    </p>
  </main>

  <!-- ============ FAB stack: view-options (top) → view toggle → + (bottom) ============ -->
  <div class="fab-stack" id="fab-stack">

    <!-- View options — switch which section is visible -->
    <div class="fab-options" id="fab-options"
         role="menu" aria-label="Show section" aria-hidden="true">
      <div class="fab-options-label" aria-hidden="true">Show only</div>

      <button class="fab-option" data-view-kind="file"
              role="menuitemradio" aria-pressed="false">
        <span class="fab-option-label">Files</span>
        <i class="bi bi-file-earmark-text"></i>
      </button>

      <button class="fab-option" data-view-kind="link"
              role="menuitemradio" aria-pressed="false">
        <span class="fab-option-label">Links</span>
        <i class="bi bi-link-45deg"></i>
      </button>

      <button class="fab-option" data-view-kind="note"
              role="menuitemradio" aria-pressed="false">
        <span class="fab-option-label">Notes</span>
        <i class="bi bi-journal-text"></i>
      </button>
    </div>

    <!-- View toggle — shows the section picker above -->
    <button class="fab fab-wrap" id="fab-wrap"
            aria-label="Switch view" aria-haspopup="menu" aria-expanded="false">
      <i class="bi bi-layers"></i>
    </button>

    <!-- Add button (unchanged behaviour) -->
    <button class="fab fab-add" id="fab" aria-label="Add new">
      <i class="bi bi-plus-lg"></i>
    </button>
  </div>

  <!-- ============ Upload / create modal ============ -->
  <div class="hidden" id="modal-backdrop">
    <div class="v-modal" role="dialog" aria-modal="true">
      <div class="v-modal-header">
        <h2>Add new</h2>
        <button class="v-modal-close" id="modal-close" aria-label="Close">
          <i class="bi bi-x-lg"></i>
        </button>
      </div>

      <div class="v-modal-tabs" id="modal-tabs">
        <button class="mtab active" data-mtab="file">
          <i class="bi bi-upload"></i> File
        </button>
        <button class="mtab" data-mtab="camera">
          <i class="bi bi-camera-video"></i> Camera
        </button>
        <button class="mtab" data-mtab="link">
          <i class="bi bi-link-45deg"></i> Link
        </button>
        <button class="mtab" data-mtab="note">
          <i class="bi bi-journal-text"></i> Note
        </button>
      </div>

      <!-- FILE -->
      <form class="modal-body" data-pane="file" id="form-file">
        <div class="mb-3">
          <label class="form-label" for="file-name">Name (optional)</label>
          <input class="form-control" id="file-name" name="name"
                 placeholder="Leave blank to keep the original filename">
        </div>
        <div class="mb-3">
          <label class="form-label" for="file-desc">Description</label>
          <textarea class="form-control" id="file-desc" name="description" rows="2"
                    placeholder="What is this file?"></textarea>
        </div>
        <div class="mb-3">
          <label class="form-label" for="file-file">File</label>
          <input class="form-control" type="file" id="file-file" name="file" required>
        </div>

        <!-- Storage mode -->
        <div class="mb-3">
          <label class="form-label" for="file-storage">Save in</label>
          <select class="form-control" id="file-storage" name="storage_mode">
            <option value="category">Category folder (pdf, png, excel, …)</option>
            <option value="mixed">Mixed folder (all file types together)</option>
          </select>
        </div>

        <!-- Subfolder (optional) -->
        <div class="mb-3">
          <label class="form-label" for="file-subfolder">Subfolder (optional)</label>
          <input class="form-control" id="file-subfolder" name="subfolder"
                 list="file-subfolder-list" autocomplete="off"
                 placeholder="Leave blank for root, or pick / type a name">
          <datalist id="file-subfolder-list"></datalist>
          <div class="v-hint">
            Pick an existing folder or type a new one — nested paths like
            <code>invoices/2024</code> are allowed.
          </div>
        </div>

        <button type="submit" class="btn-primary">
          <i class="bi bi-cloud-upload"></i> Upload to MEGA
        </button>
      </form>

      <!-- CAMERA -->
      <form class="modal-body hidden" data-pane="camera" id="form-camera">
        <div class="mb-3">
          <label class="form-label" for="camera-name">Name</label>
          <input class="form-control" id="camera-name" name="name"
                 placeholder="capture_<auto>.png">
        </div>
        <div class="mb-3">
          <label class="form-label" for="camera-desc">Description</label>
          <textarea class="form-control" id="camera-desc" name="description" rows="2"></textarea>
        </div>
        <div class="camera-wrap mb-3">
          <video id="camera-video" autoplay playsinline muted></video>
          <canvas id="camera-canvas" class="hidden"></canvas>
        </div>
        <div class="camera-controls mb-3">
          <button type="button" class="btn-secondary" id="camera-start">
            <i class="bi bi-camera-video"></i> Start camera
          </button>
          <button type="button" class="btn-secondary" id="camera-stop">
            <i class="bi bi-stop-circle"></i> Stop
          </button>
          <button type="button" class="btn-primary" id="camera-capture" disabled>
            <i class="bi bi-camera"></i> Capture & upload
          </button>
        </div>

        <!-- Storage mode -->
        <div class="mb-3">
          <label class="form-label" for="camera-storage">Save in</label>
          <select class="form-control" id="camera-storage" name="storage_mode">
            <option value="category">Category folder (png)</option>
            <option value="mixed">Mixed folder (all file types together)</option>
          </select>
        </div>

        <!-- Subfolder (optional) -->
        <div class="mb-3">
          <label class="form-label" for="camera-subfolder">Subfolder (optional)</label>
          <input class="form-control" id="camera-subfolder" name="subfolder"
                 list="camera-subfolder-list" autocomplete="off"
                 placeholder="Leave blank for root, or pick / type a name">
          <datalist id="camera-subfolder-list"></datalist>
        </div>
      </form>

      <!-- LINK -->
      <form class="modal-body hidden" data-pane="link" id="form-link">
        <div class="mb-3">
          <label class="form-label" for="link-title">Title</label>
          <input class="form-control" id="link-title" name="title" required>
        </div>
        <div class="mb-3">
          <label class="form-label" for="link-url">URL</label>
          <input class="form-control" id="link-url" name="url" type="url"
                 required placeholder="https://…">
        </div>
        <div class="mb-3">
          <label class="form-label" for="link-desc">Description</label>
          <textarea class="form-control" id="link-desc" name="description" rows="2"></textarea>
        </div>
        <div class="mb-3">
          <label class="form-label" for="link-does">What it does</label>
          <textarea class="form-control" id="link-does" name="what_it_does" rows="3"></textarea>
        </div>
        <button type="submit" class="btn-primary">
          <i class="bi bi-link-45deg"></i> Save link
        </button>
      </form>

      <!-- NOTE -->
      <form class="modal-body hidden" data-pane="note" id="form-note">
        <div class="mb-3">
          <label class="form-label" for="note-title">Title</label>
          <input class="form-control" id="note-title" name="title" required>
        </div>
        <div class="mb-3">
          <label class="form-label" for="note-desc">Description</label>
          <textarea class="form-control" id="note-desc" name="description" rows="2"></textarea>
        </div>
        <div class="mb-3">
          <label class="form-label" for="note-body">Body</label>
          <textarea class="form-control" id="note-body" name="body" rows="6" required></textarea>
        </div>
        <div class="mb-3">
          <label class="form-label">Colour</label>
          <div class="color-row">
            <input type="color" id="note-color" value="#6366f1">
            <input type="text" class="form-control" id="note-color-hex"
                   value="#6366f1" maxlength="7">
          </div>
        </div>
        <button type="submit" class="btn-primary">
          <i class="bi bi-journal-plus"></i> Save note
        </button>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }

    // -----------------------------------------------------------------
    // Logout — POST /api/auth/logout then redirect to /login
    // -----------------------------------------------------------------
    (function () {
      const btn = document.getElementById('logout-btn');
      if (!btn) return;

      btn.addEventListener('click', async () => {
        if (!confirm('Sign out of MyVault?')) return;

        btn.disabled = true;
        try {
          await fetch('/api/auth/logout', {
            method: 'POST',
            credentials: 'same-origin',
          });
        } catch {
          // ignore network failures — still redirect
        }
        window.location.href = '/login';
      });
    })();

    // If any fetch returns 401, bounce back to /login automatically.
    (function () {
      const originalFetch = window.fetch;
      window.fetch = function () {
        return originalFetch.apply(this, arguments).then(res => {
          if (res.status === 401) {
            // Only redirect if we're not already on the login page
            if (!location.pathname.startsWith('/login')) {
              window.location.href = '/login';
            }
          }
          return res;
        });
      };
    })();
  </script>

  <style>
    /* ---------------------------------------------------------------------
       Topbar actions — holds tabs + logout button side-by-side
       --------------------------------------------------------------------- */
    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .logout-btn {
      padding: 8px 12px;
      font-size: 0.9rem;
      color: var(--muted);
      border: 1px solid var(--border);
      background: var(--bg-2);
    }
    .logout-btn:hover {
      color: #ffb4b4;
      background: rgba(239, 68, 68, 0.12);
      border-color: rgba(239, 68, 68, 0.35);
    }
    .logout-btn i { font-size: 1rem; }

    /* Small addition — helper text under sub-folder inputs. */
    .v-hint {
      color: var(--muted, #8394ab);
      font-size: 0.72rem;
      margin-top: 4px;
      line-height: 1.4;
    }
    .v-hint code {
      color: #a8b3ff;
      background: rgba(99, 102, 241, 0.12);
      padding: 1px 4px;
      border-radius: 4px;
    }
    .card-subfolder {
      color: var(--muted, #8394ab);
      font-size: 0.72rem;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .card-subfolder i { font-size: 0.85rem; opacity: 0.9; }

    /* Mobile tweak — keep the logout button from wrapping awkwardly */
    @media (max-width: 640px) {
      .topbar-actions { width: 100%; justify-content: space-between; }
      .logout-btn { flex-shrink: 0; }
    }
  </style>
</body>
</html>
