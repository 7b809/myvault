<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f14">
  <title>MyVault · Viewer</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/static/icons/icon.svg" type="image/svg+xml">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="viewer-body">
  <header class="topbar">
    <div class="brand">
      <a href="/" class="back" aria-label="Back" title="Back (Esc)">
        <i class="bi bi-arrow-left"></i>
      </a>
      <img src="/static/icons/icon.svg" alt="" class="brand-logo">
      <div class="brand-text">
        <h1 id="v-title">Loading…</h1>
        <span id="v-sub"></span>
      </div>
    </div>
    <div class="viewer-actions" id="v-actions"></div>
  </header>

  <main class="viewer-main" id="viewer-main">
    <div class="viewer-skeleton" aria-hidden="true">
      <div class="skel skel-block"></div>
      <div class="skel skel-line"></div>
      <div class="skel skel-line short"></div>
    </div>
  </main>

  <script>
    const ITEM_ID = {{ item_id | tojson }};

    // ---------------------------------------------------------------------
    // Helpers
    // ---------------------------------------------------------------------
    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }

    function emoji(c) {
      return ({
        pdf: '📕', excel: '📊', json: '🧾',
        png: '🖼️', jpg: '🖼️', other: '📁'
      }[c]) || '📁';
    }

    function fmtSize(n) {
      if (!n && n !== 0) return '';
      const u = ['B', 'KB', 'MB', 'GB', 'TB'];
      let i = 0, x = n;
      while (x >= 1024 && i < u.length - 1) { x /= 1024; i++; }
      return `${x.toFixed(x < 10 ? 2 : 1)} ${u[i]}`;
    }

    function fmtDate(iso) {
      if (!iso) return '';
      try {
        const d = new Date(iso);
        if (isNaN(d.getTime())) return '';
        return d.toLocaleString(undefined, {
          year: 'numeric', month: 'short', day: 'numeric',
          hour: '2-digit', minute: '2-digit'
        });
      } catch { return ''; }
    }

    async function copyToClipboard(text, btnEl) {
      try {
        await navigator.clipboard.writeText(text);
      } catch {
        // Fallback for insecure contexts
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); } catch {}
        ta.remove();
      }
      if (btnEl) {
        const orig = btnEl.innerHTML;
        btnEl.innerHTML = '<i class="bi bi-check2"></i> Copied';
        setTimeout(() => { btnEl.innerHTML = orig; }, 1200);
      }
    }

    // ---------------------------------------------------------------------
    // Metadata strip (created date · size · category)
    // ---------------------------------------------------------------------
    function metaStrip(item) {
      const bits = [];
      if (item.created_at) {
        bits.push(`<span><i class="bi bi-clock"></i> ${esc(fmtDate(item.created_at))}</span>`);
      }
      if (item.size) {
        bits.push(`<span><i class="bi bi-hdd"></i> ${esc(fmtSize(item.size))}</span>`);
      }
      if (item.category) {
        bits.push(`<span><i class="bi bi-tag"></i> ${esc(item.category)}</span>`);
      }
      if (item.kind === 'link') {
        bits.push(`<span><i class="bi bi-link-45deg"></i> link</span>`);
      }
      if (item.kind === 'note') {
        bits.push(`<span><i class="bi bi-journal-text"></i> note</span>`);
      }
      if (!bits.length) return '';
      return `<div class="viewer-meta">${bits.join('')}</div>`;
    }

    // ---------------------------------------------------------------------
    // Delete
    // ---------------------------------------------------------------------
    async function deleteCurrent() {
      if (!confirm('Delete this item permanently? This cannot be undone.')) return;
      try {
        const res = await fetch(`/api/items/${encodeURIComponent(ITEM_ID)}`, {
          method: 'DELETE'
        });
        if (!res.ok) {
          let msg = `HTTP ${res.status}`;
          try { const j = await res.json(); msg = j.detail || msg; } catch {}
          throw new Error(msg);
        }
        location.href = '/';
      } catch (err) {
        alert('Delete failed: ' + err.message);
      }
    }

    // ---------------------------------------------------------------------
    // Actions per kind
    // ---------------------------------------------------------------------
    function renderActions(item) {
      const actions = document.getElementById('v-actions');
      const parts = [];

      if (item.kind === 'file') {
        parts.push(`
          <a class="btn-sm" href="/raw/${item.id}" target="_blank" rel="noopener"
             title="Open raw">
            <i class="bi bi-box-arrow-up-right"></i> Open raw
          </a>`);
        parts.push(`
          <a class="btn-sm" href="/download/${item.id}" id="v-download"
             title="Download (D)">
            <i class="bi bi-download"></i> Download
          </a>`);
        if (item.link) {
          parts.push(`
            <button class="btn-sm" type="button" id="v-copy-mega"
                    title="Copy MEGA share link">
              <i class="bi bi-share"></i> Copy MEGA link
            </button>`);
        }
      } else if (item.kind === 'link') {
        parts.push(`
          <a class="btn-sm" href="${esc(item.url)}" target="_blank" rel="noopener"
             title="Open URL">
            <i class="bi bi-box-arrow-up-right"></i> Open
          </a>`);
        parts.push(`
          <button class="btn-sm" type="button" id="v-copy-url"
                  title="Copy URL">
            <i class="bi bi-clipboard"></i> Copy URL
          </button>`);
      } else if (item.kind === 'note') {
        parts.push(`
          <button class="btn-sm" type="button" id="v-copy-note"
                  title="Copy note body">
            <i class="bi bi-clipboard"></i> Copy text
          </button>`);
      }

      parts.push(`
        <button class="btn-sm danger" type="button" id="v-delete"
                title="Delete">
          <i class="bi bi-trash"></i> Delete
        </button>`);

      actions.innerHTML = parts.join('');

      // Wire the buttons that were just created.
      const copyMega = document.getElementById('v-copy-mega');
      if (copyMega && item.link) {
        copyMega.onclick = () => copyToClipboard(item.link, copyMega);
      }
      const copyUrl = document.getElementById('v-copy-url');
      if (copyUrl) copyUrl.onclick = () => copyToClipboard(item.url, copyUrl);
      const copyNote = document.getElementById('v-copy-note');
      if (copyNote) copyNote.onclick = () => copyToClipboard(item.body, copyNote);
      const del = document.getElementById('v-delete');
      if (del) del.onclick = deleteCurrent;
    }

    // ---------------------------------------------------------------------
    // Render
    // ---------------------------------------------------------------------
    function render(item, main) {
      const title = item.title || item.name || 'Item';
      document.title = `MyVault · ${title}`;
      document.getElementById('v-title').textContent = title;
      document.getElementById('v-sub').textContent = item.description || '';

      renderActions(item);

      // ---- LINK ---------------------------------------------------------
      if (item.kind === 'link') {
        main.innerHTML = `
          <div class="viewer-info">
            ${metaStrip(item)}
            <h2>${esc(item.title)}</h2>
            <p class="muted">${esc(item.description)}</p>
            <p>
              <a class="link-url" href="${esc(item.url)}" target="_blank" rel="noopener">
                ${esc(item.url)}
              </a>
            </p>
            ${item.what_it_does
              ? `<h3>What it does</h3><p>${esc(item.what_it_does)}</p>`
              : ''}
          </div>`;
        return;
      }

      // ---- NOTE ---------------------------------------------------------
      if (item.kind === 'note') {
        main.innerHTML = `
          <div class="viewer-note" style="--note-color:${esc(item.color || '#6366f1')}">
            ${metaStrip(item)}
            <h2>${esc(item.title)}</h2>
            <p class="muted">${esc(item.description)}</p>
            <pre>${esc(item.body)}</pre>
          </div>`;
        return;
      }

      // ---- FILE ---------------------------------------------------------
      const cat = item.category;
      const src = `/raw/${item.id}`;
      const meta = metaStrip(item);

      if (cat === 'png' || cat === 'jpg') {
        main.innerHTML = `
          ${meta}
          <img class="viewer-img" src="${src}" alt="${esc(item.name)}"
               title="Click to open full size"
               onclick="window.open('${src}', '_blank')">`;
      } else if (cat === 'pdf') {
        main.innerHTML = `
          ${meta}
          <iframe class="viewer-pdf" src="${src}" title="${esc(item.name)}"></iframe>`;
      } else if (cat === 'json') {
        main.innerHTML = `${meta}<pre class="viewer-json" id="json-pane">Loading…</pre>`;
        fetch(src)
          .then(r => r.text())
          .then(t => {
            let pretty = t;
            try { pretty = JSON.stringify(JSON.parse(t), null, 2); } catch {}
            document.getElementById('json-pane').textContent = pretty;
          })
          .catch(() => {
            document.getElementById('json-pane').textContent =
              'Failed to load JSON';
          });
      } else {
        main.innerHTML = `
          ${meta}
          <div class="viewer-info center">
            <div class="preview-icon big">${emoji(cat)}</div>
            <h2>${esc(item.name)}</h2>
            <p class="muted">${esc(item.description || '')}</p>
            <p class="muted">${fmtSize(item.size)} · ${esc(item.category)}</p>
            <a class="btn-primary" href="/download/${item.id}">
              <i class="bi bi-download"></i> Download
            </a>
          </div>`;
      }
    }

    // ---------------------------------------------------------------------
    // Boot
    // ---------------------------------------------------------------------
    let currentItem = null;

    async function init() {
      const main = document.getElementById('viewer-main');
      try {
        const res = await fetch(`/api/items/${encodeURIComponent(ITEM_ID)}`);
        if (!res.ok) {
          let msg = 'Item not found';
          try { const j = await res.json(); msg = j.detail || msg; } catch {}
          throw new Error(msg);
        }
        currentItem = await res.json();
        render(currentItem, main);
      } catch (e) {
        main.innerHTML = `
          <div class="error">
            <div style="font-size:2rem;margin-bottom:12px;">⚠️</div>
            <div>${esc(e.message)}</div>
            <div style="margin-top:18px;">
              <a class="btn-sm" href="/">
                <i class="bi bi-house"></i> Back to home
              </a>
            </div>
          </div>`;
      }
    }

    // Keyboard shortcuts
    document.addEventListener('keydown', e => {
      const tag = (e.target && e.target.tagName || '').toLowerCase();
      if (tag === 'input' || tag === 'textarea' || e.metaKey || e.ctrlKey || e.altKey) return;

      if (e.key === 'Escape') {
        location.href = '/';
      } else if (e.key === 'd' || e.key === 'D') {
        if (currentItem && currentItem.kind === 'file') {
          location.href = `/download/${currentItem.id}`;
        }
      }
    });

    init();
  </script>

  <style>
    /* Scoped to viewer.html — no changes to style.css needed. */
    .viewer-skeleton {
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 20px 0;
    }
    .skel {
      background: linear-gradient(
        90deg,
        #121821 0%,
        #1a2230 50%,
        #121821 100%
      );
      background-size: 200% 100%;
      animation: skel-shimmer 1.4s ease-in-out infinite;
      border-radius: 12px;
    }
    .skel-block { height: 320px; }
    .skel-line  { height: 18px; width: 60%; }
    .skel-line.short { width: 35%; }
    @keyframes skel-shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .viewer-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin: 0 0 18px;
      color: var(--muted, #8394ab);
      font-size: 0.78rem;
    }
    .viewer-meta span {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .viewer-meta i { font-size: 0.9rem; opacity: 0.85; }

    .viewer-img { cursor: zoom-in; }
  </style>
</body>
</html>
